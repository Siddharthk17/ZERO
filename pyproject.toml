[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-chess"
version = "1.7.2.8"
description = "ZERO-X: hardware-aware tabula-rasa chess reinforcement learning engine."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0; python_version < '3.14'",
  "numpy>=2.2.0; python_version >= '3.14'",
  "torch>=2.2.0; python_version < '3.14'",
  "torch>=2.9.0; python_version >= '3.14'",
  "fastapi>=0.136.0",
  "uvicorn[standard]>=0.38.0",
  "websockets>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
zero-uci = "zero_chess.uci:main"
zero-train = "train_master:main"
zero-ws = "zero_chess.websocket_server:main"

[tool.setuptools]
py-modules = ["train_master"]

[tool.setuptools.packages.find]
include = ["zero_chess*"]

[tool.setuptools.package-data]
zero_chess = ["*.so", "*.pyd", "*.dylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = [
    "N812",  # `import torch.nn.functional as F` is the canonical PyTorch convention
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # test files conditionally import optional deps after version checks

[tool.ruff.lint.isort]
combine-as-imports = true
